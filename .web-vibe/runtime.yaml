backend:
  image: web-vibe-workspace-backend-runner:local
  command: >-
    uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace
  containerPort: 8000
  healthPath: /health

frontend:
  image: web-vibe-workspace-frontend-runner:local
  command: >-
    /node_modules/.bin/vite --host 0.0.0.0 --port 3000 --strictPort
  containerPort: 3000
  backendUrl: http://backend:8000
